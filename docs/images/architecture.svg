<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">zapret-linux architecture</title>
  <desc id="desc">Architecture diagram showing the launcher, Flowseal data, nfqws and NFQUEUE firewall path.</desc>
  <defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity=".35"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#40d6df"/></marker></defs>
  <rect width="1200" height="760" fill="#101419"/>
  <text x="72" y="82" fill="#f4f7f8" font-family="Inter, sans-serif" font-size="38" font-weight="700">How zapret-linux works</text>
  <text x="72" y="119" fill="#94a2ab" font-family="Inter, sans-serif" font-size="18">A self-contained launcher around nfqws, Flowseal strategies and Linux NFQUEUE.</text>
  <g filter="url(#shadow)" font-family="Inter, sans-serif">
    <rect x="70" y="190" width="250" height="170" rx="14" fill="#182129" stroke="#37d6df" stroke-width="2"/><text x="100" y="238" fill="#37d6df" font-size="16" font-weight="700">01 / CONTROL</text><text x="100" y="280" fill="#f4f7f8" font-size="27" font-weight="700">zapret.sh</text><text x="100" y="315" fill="#a9b5bc" font-size="17">TUI · validate · update</text><text x="100" y="341" fill="#a9b5bc" font-size="17">game-mode · systemd</text>
    <rect x="475" y="190" width="250" height="170" rx="14" fill="#182129" stroke="#9dcb58" stroke-width="2"/><text x="505" y="238" fill="#9dcb58" font-size="16" font-weight="700">02 / STRATEGIES</text><text x="505" y="280" fill="#f4f7f8" font-size="27" font-weight="700">Flowseal data</text><text x="505" y="315" fill="#a9b5bc" font-size="17">general*.bat · lists</text><text x="505" y="341" fill="#a9b5bc" font-size="17">user-lists/ overrides</text>
    <rect x="880" y="190" width="250" height="170" rx="14" fill="#182129" stroke="#e4b84f" stroke-width="2"/><text x="910" y="238" fill="#e4b84f" font-size="16" font-weight="700">03 / ENGINE</text><text x="910" y="280" fill="#f4f7f8" font-size="27" font-weight="700">nfqws</text><text x="910" y="315" fill="#a9b5bc" font-size="17">local static binary</text><text x="910" y="341" fill="#a9b5bc" font-size="17">running in background</text>
    <rect x="270" y="530" width="660" height="120" rx="14" fill="#182129" stroke="#d27cff" stroke-width="2"/><text x="600" y="578" text-anchor="middle" fill="#d27cff" font-size="16" font-weight="700">04 / LINUX NETWORK PATH</text><text x="600" y="615" text-anchor="middle" fill="#f4f7f8" font-size="25" font-weight="700">iptables / ip6tables → NFQUEUE → network traffic</text>
  </g>
  <g fill="none" stroke="#40d6df" stroke-width="3" marker-end="url(#arrow)"><path d="M320 275 H465"/><path d="M725 275 H870"/><path d="M1005 360 V455 Q1005 490 930 490 H800"/><path d="M400 490 H300 Q195 490 195 390 V360"/></g>
  <text x="392" y="253" text-anchor="middle" fill="#8f9da5" font-family="Inter, sans-serif" font-size="15">select &amp; validate</text><text x="797" y="253" text-anchor="middle" fill="#8f9da5" font-family="Inter, sans-serif" font-size="15">launch config</text><text x="1030" y="435" fill="#8f9da5" font-family="Inter, sans-serif" font-size="15">queue traffic</text><text x="225" y="456" fill="#8f9da5" font-family="Inter, sans-serif" font-size="15">apply rules</text>
</svg>
