    <path d="M72 100 H330 M750 100 H1144" stroke="#71808a" stroke-width="2" stroke-dasharray="10 8"/><text x="540" y="106" text-anchor="middle" fill="#37d6df" font-weight="700">zapret-linux / Flowseal v72.13</text>
    <text x="72" y="143" fill="#71808a">|</text><rect x="88" y="119" width="310" height="34" rx="3" fill="#19783b"/><text x="101" y="143" fill="#f4f7f8" font-weight="700"> ACTIVE: general (ALT)</text><text x="1144" y="143" text-anchor="end" fill="#71808a">|</text>
    <text x="72" y="181" fill="#71808a">|</text><rect x="88" y="157" width="334" height="34" rx="3" fill="#8b701d"/><text x="101" y="181" fill="#fff" font-weight="700"> Autostart: general (ALT)</text><text x="1144" y="181" text-anchor="end" fill="#71808a">|</text>
    <text x="72" y="219" fill="#71808a">|  Game filter: tcp</text><text x="1144" y="219" text-anchor="end" fill="#71808a">|</text>
    <text x="72" y="257" fill="#71808a">|</text><text x="1144" y="257" text-anchor="end" fill="#71808a">|</text>
    <rect x="88" y="270" width="1056" height="37" rx="3" fill="#174b8e"/><text x="101" y="296" fill="#f4f7f8" font-weight="700"> &gt; general (ALT)</text><text x="1144" y="296" text-anchor="end" fill="#174b8e">|</text>
    <text x="72" y="334" fill="#71808a">|   <tspan fill="#35d06f">*</tspan> general</text><text x="1144" y="334" text-anchor="end" fill="#71808a">|</text>
    <text x="72" y="372" fill="#71808a">|   general (ALT2)</text><text x="1144" y="372" text-anchor="end" fill="#71808a">|</text>
    <text x="72" y="410" fill="#71808a">|   general (ALT3)</text><text x="1144" y="410" text-anchor="end" fill="#71808a">|</text>
    <text x="72" y="448" fill="#71808a">|   general (ALT4)</text><text x="1144" y="448" text-anchor="end" fill="#71808a">|</text>
    <text x="72" y="486" fill="#71808a">|   general (FAKE TLS AUTO)</text><text x="1144" y="486" text-anchor="end" fill="#71808a">|</text>
    <text x="72" y="524" fill="#71808a">|</text><text x="1144" y="524" text-anchor="end" fill="#71808a">|</text>
    <text x="72" y="562" fill="#71808a">|  [Enter] Launch/Switch  [s] Stop  [a] Autostart</text><text x="1144" y="562" text-anchor="end" fill="#71808a">|</text>
    <text x="72" y="600" fill="#71808a">|  [g] Game filter  [u] Update  [q] Quit</text><text x="1144" y="600" text-anchor="end" fill="#71808a">|</text>
    <text x="72" y="638" fill="#71808a">+</text><path d="M86 632 H1130" stroke="#71808a" stroke-width="2"/><text x="1144" y="638" text-anchor="end" fill="#71808a">+</text>
  </g>
  <text x="600" y="700" text-anchor="middle" fill="#5b6870" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">Representative TUI view — rendered from the launcher layout</text>
</svg>
