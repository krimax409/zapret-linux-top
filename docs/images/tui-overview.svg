<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">zapret-linux TUI launcher</title>
  <desc id="desc">Dark terminal-style screenshot of the zapret-linux interactive launcher.</desc>
  <rect width="1200" height="720" rx="18" fill="#101419"/>
  <rect x="24" y="24" width="1152" height="650" rx="10" fill="#0b0f13" stroke="#2b353d" stroke-width="2"/>
  <circle cx="54" cy="52" r="7" fill="#ff5f56"/><circle cx="78" cy="52" r="7" fill="#ffbd2e"/><circle cx="102" cy="52" r="7" fill="#27c93f"/>
  <text x="600" y="58" text-anchor="middle" fill="#7f8b94" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">zapret-linux — interactive launcher</text>
  <text x="1148" y="58" text-anchor="end" fill="#5b6870" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">TUI PREVIEW · NOT LIVE</text>
